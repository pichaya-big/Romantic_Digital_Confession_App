name: Deploy to VPS

on:
  push:
    tags:
      - "v*" # deploy เฉพาะเมื่อ push tag ที่ขึ้นต้นด้วย v เช่น v1.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        TAG_NAME: ${{ github.ref_name }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.VPS_PORT }}
        envs: TAG_NAME
        script: |
          set -e

          # 1. ไปยังโฟลเดอร์โปรเจกต์บน VPS
          cd "${{ secrets.VPS_APP_DIR }}"

          # 2. ดึง tag ล่าสุดจาก GitHub แล้ว checkout ไปที่ tag ที่ push มา
          git fetch --tags --force origin
          git checkout --force "$TAG_NAME"

          # 3. ปิดและอัปเดต Docker Container
          docker compose down
          docker compose up -d --build --remove-orphans

          echo "Deployed $TAG_NAME"
