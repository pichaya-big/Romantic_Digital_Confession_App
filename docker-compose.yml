services:
  web:
    build: .
    image: heartstrings-web:latest
    container_name: heartstrings-web
    restart: unless-stopped
    # ไม่เปิด port ออก host ให้ Nginx Proxy Manager เข้าถึงผ่าน network nginx-proxy-net
    expose:
      - "80"
    networks:
      - nginx-proxy-net

networks:
  nginx-proxy-net:
    external: true
